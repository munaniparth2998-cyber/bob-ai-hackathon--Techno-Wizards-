submission:
  title: "Threat Correlation & Forecasting Assistant"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Security Operations Centers receive thousands of daily security alerts.
    Related alerts are often viewed as isolated events, making it difficult
    for analysts to identify multi-stage attack chains and quickly prioritise
    the incidents that require immediate attention.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    Threat Correlation & Forecasting Assistant transforms scattered security
    alerts into prioritised and explainable attack stories. It preprocesses
    and correlates alerts using source IP proximity and deterministic time
    windows, maps suspicious activity to MITRE ATT&CK techniques, calculates
    technique-weighted risk scores, forecasts plausible next techniques using
    documented ATT&CK relationships, and generates an actionable BLUF report.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Alert correlation using same source IP and a deterministic 10-minute time window"                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "Alert preprocessing, deduplication, timestamp correction, and chronological ordering"
    - "MITRE ATT&CK technique mapping"
    - "Explainable technique-weighted risk scoring"                               # optional 4th
    - "Knowledge-based forecasting of plausible next attack techniques"                               # optional 5th

  tech_stack:
    languages: ["Python", "JavaScript", "HTML", "CSS"]                     # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: []                     # e.g., ["FastAPI", "React"]
    ibm_technologies: []               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: []                      # e.g., ["PostgreSQL", "Redis"]
    other: []                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Replace with what aspect of the submission you consider strongest
    and want judges to pay special attention to.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Replace with any known limitations, incomplete features,
    or shortcuts taken due to time constraints.

